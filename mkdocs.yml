site_name: FaceTrack Documentation
site_url: https://soulcatentertainment.github.io/FaceTrack-Developer-Guide/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.expand

markdown_extensions:
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Specifications:
      - Blendshapes: specifications/blendshapes.md
      - Rigging & Kinematics: specifications/kinematics.md
  - Delivery Pipelines:
      - File Export: pipelines/file-export.md
      - Live Capture: pipelines/live-capture.md
  - Integrations:
      - Live Capture Samples: integrations/live-capture-integration.md
      # - Importer Samples: integrations/file-importer-integration.md
