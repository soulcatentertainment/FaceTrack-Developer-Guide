site_name: FaceTrack Documentation
site_url: https://soulcatentertainment.github.io/FaceTrack-Developer-Guide/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.expand

markdown_extensions:
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Specifications:
      - Blendshape Channels: specifications/blendshapes.md
      - Rigging & Kinematics: specifications/kinematics.md
  - Delivery Pipelines:
      - File Export Formats: pipelines/file-export.md
      - Live Capture (UDP): pipelines/live-capture.md
  - Integrations:
      - Python Receiver: integrations/python.md
      - Unity / C#: integrations/unity.md
